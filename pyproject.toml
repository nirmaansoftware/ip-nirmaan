[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirmaan-ip"
version = "1.16.0"
description = "Nirmaan IP: an organizational operating system for semiconductor engineering, with VeriTriage verification intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Om Patel", email = "patel2om002@gmail.com" }]
keywords = ["eda", "semiconductor", "ip", "verification", "rtl", "uvm", "systemverilog", "agents", "workflow", "root-cause"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/patel-om/nirmaan-ip"
Repository = "https://github.com/patel-om/nirmaan-ip"

[project.scripts]
veritriage = "veritriage.cli.main:app"
nirmaan = "nirmaan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/veritriage", "src/nirmaan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
