[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ip-nirmaan"
version = "1.25.0"
description = "IP Nirmaan: an organizational operating system for semiconductor engineering, with VeriTriage verification intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. All rights reserved. See LICENSE." }
license-files = ["LICENSE", "NOTICE", "third_party/LICENSE-Apache-2.0.txt"]
authors = [{ name = "Nirmaan", email = "nirmaansoftware@gmail.com" }]
keywords = ["eda", "semiconductor", "ip", "verification", "rtl", "uvm", "systemverilog", "agents", "workflow", "root-cause"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://ip.nirmaan.online"
Repository = "https://github.com/nirmaansoftware/ip-nirmaan"

[project.scripts]
veritriage = "veritriage.cli.main:app"
nirmaan = "nirmaan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/veritriage", "src/nirmaan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
