# The tools a live evaluation runs with (.github/workflows/live-eval.yml), the same for a replay,
# live trials and the re-judge: Python 3.12, the open-source EDA tools (and acl, which the seat
# account's grants use), SymbiYosys, Yices and eqy from the pinned OSS CAD Suite, Claude Code from
# .github/live-eval (npm ci checks each package against the sha512 in its lockfile), and the
# package with the cocotb extra. It takes no secret. With `whole_flow: "true"` (a `flow/` case, G3 council record
# 2026-11-17, decision 4: both whole-flow cases run on one tool set) it also installs the RISC-V cross compiler
# ci.yml installs, which the register block flow's firmware stage builds with, and fails if any tool a whole flow
# runs is missing: the tools are required, never skipped. Single-seat cases get the tool set they had.
name: Live evaluation tools
description: Install what a live evaluation runs with, Claude Code pinned by lockfile and cocotb included.
inputs:
  whole_flow:
    description: '"true" for a whole-flow case: also the RISC-V cross compiler, and every tool required'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install open-source EDA tools
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y verilator iverilog yosys acl
    - name: Install the RISC-V cross compiler (whole-flow cases)
      if: inputs.whole_flow == 'true'
      shell: bash
      run: |
        sudo apt-get install -y gcc-riscv64-unknown-elf
        riscv64-unknown-elf-gcc --version | head -1
        riscv64-unknown-elf-gcc -print-multi-lib | grep rv32i/ilp32
    - name: Install SymbiYosys, Yices and eqy (OSS CAD Suite 2026-09-28)
      uses: ./.github/actions/oss-cad-suite
      with:
        # eqy judges the equivalence cases, as in CI's test job (gate W2C3,
        # council/records/2026-11-23-wave-2-close-meeting-1.md).
        tools: sby yices-smt2 eqy
        # Root's, outside the runner's temporary folder, which the seat account may not read: sby and eqy run as that
        # account in these jobs (gate ET2, council/records/2026-11-22-eda-tools-seat-account.md; gate W2C3).
        root: /opt
    - name: Install Claude Code
      shell: bash
      run: |
        npm ci --prefix .github/live-eval --no-audit --no-fund
        echo "NIRMAAN_CLAUDE_CODE=$PWD/.github/live-eval/node_modules/.bin/claude" >> "$GITHUB_ENV"
        .github/live-eval/node_modules/.bin/claude --version
    - name: Install the package with the cocotb extra
      shell: bash
      run: pip install -e ".[dev,cocotb]"
    - name: Check every tool a whole flow runs (whole-flow cases)
      if: inputs.whole_flow == 'true'
      shell: bash
      run: |
        for tool in verilator iverilog vvp yosys sby yices-smt2 cc make riscv64-unknown-elf-gcc cocotb-config; do
          if ! command -v "$tool" > /dev/null; then
            echo "::error::$tool is not installed; a whole-flow case runs with every tool, none skipped."
            exit 1
          fi
        done
