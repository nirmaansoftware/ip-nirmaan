# The tools a live evaluation runs with (.github/workflows/live-eval.yml), the same for a replay,
# live trials and the re-judge: Python 3.12, the open-source EDA tools (and acl, which the seat
# account's grants use), SymbiYosys and Yices from the pinned OSS CAD Suite, Claude Code from
# .github/live-eval (npm ci checks each package against the sha512 in its lockfile), and the
# package with the cocotb extra. It takes no secret.
name: Live evaluation tools
description: Install what a live evaluation runs with, Claude Code pinned by lockfile and cocotb included.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install open-source EDA tools
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y verilator iverilog yosys acl
    - name: Install SymbiYosys and Yices (OSS CAD Suite 2026-09-28)
      uses: ./.github/actions/oss-cad-suite
      with:
        tools: sby yices-smt2
    - name: Install Claude Code
      shell: bash
      run: |
        npm ci --prefix .github/live-eval --no-audit --no-fund
        echo "NIRMAAN_CLAUDE_CODE=$PWD/.github/live-eval/node_modules/.bin/claude" >> "$GITHUB_ENV"
        .github/live-eval/node_modules/.bin/claude --version
    - name: Install the package with the cocotb extra
      shell: bash
      run: pip install -e ".[dev,cocotb]"
