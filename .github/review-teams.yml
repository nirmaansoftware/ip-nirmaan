# Review teams: who reviews which files in a pull request.
#
# Decided in council/records/2026-10-17-teams-and-pr-review.md (section 1, and
# the founder classes in section 2). How the review runs:
# docs/REVIEW_MECHANISM.md. Status: PLANNED. Nothing reads this file to post a
# review status yet; until the GitHub App and the ruleset are live, a review
# status is a convention and the founder merges every pull request.
#
# Rules are read from main, never from the pull request's head.
#
# How a file is mapped:
# - Path rules are globs on the path from the repository root. "*" matches
#   within one directory, "**" matches any number of directories (also none).
# - The last rule in "rules" that matches a file wins (as in CODEOWNERS), so
#   the list runs from general to specific and "**" (the catch-all) comes
#   first. The winning rule gives the owning team, which holds key 1, and its
#   co-owners, which also hold key 1.
# - A pull request's owning teams are every team the winning rules of its
#   changed files name, plus the teams that sections and content rules add.
# - Ledger files and sections add no owning team when the pull request also
#   changes other paths.
#
# tests/test_review_teams.py checks this file against `git ls-files`: every
# tracked file maps to a team, every glob wins at least one tracked file (no
# dead rule), every seat named here has a file in council/, every marker
# below exists in its file, and .github/CODEOWNERS equals the founder class
# path globs.

version: 1

teams:
  council:
    name: Council
    key2: chair
    leads: [security, qa-evidence]
    members: []
    note: security leads control files; qa-evidence leads records and seat files.
  silicon-design:
    name: Silicon Design
    leads: [design-architect]
    members: [dft-engineer, physical-design-engineer, firmware-engineer]
  verification:
    name: Verification
    leads: [verification-lead]
    members: [qa-evidence]
    note: key 1 on any gate change, whichever team opened the pull request.
  eda-platform:
    name: EDA and Platform
    leads: [eda-tooling]
    members: [security, ai-engineer]
    note: owns every file no other rule matches (the catch-all).
  product-site:
    name: Product and Site
    leads: [product-lead]
    members: [site-engineer, brand-content, market-research]
  business:
    name: Business
    leads: [legal-compliance, finance-licensing]
    members: [legal-counsel, tax-accounts, partnerships]
    note: legal-compliance leads licences, notices and third-party code and text; finance-licensing leads prices, commercial terms and spend.

rules:
  # Catch-all: every file no later rule matches.
  - team: eda-platform
    paths: ['**']

  # EDA and Platform, claimed explicitly so the catch-all above stays a
  # safety net (lead review 2026-10-17): the Nirmaan platform core, its tests
  # and docs. Later rules win the files they name.
  - team: eda-platform
    paths:
      - src/nirmaan/**
      - .gitignore
      - tests/conftest.py
      - tests/laws.py
      - tests/test_laws.py
      - tests/nirmaan_helpers.py
      - tests/test_nirmaan_*.py
      - tests/test_scoped_registries.py
      - tests/test_review_teams.py
      - tests/test_review_cleanups.py
      - tests/fixtures/applicability/**
      - tests/fixtures/projects/**
      - tests/fixtures/prompts/**
      - tests/fixtures/history_headings.txt
      - docs/architecture/**
      - docs/AI_WORKERS.md
      - docs/AUTO_LOOP.md
      - docs/CONSTITUTION_HARDENING.md
      - docs/CONTRIBUTING.md
      - docs/DECISIONS_CLI_MCP.md
      - docs/DELIVERABLE_EXPORT.md
      - docs/DEMO_SURFACES.md
      - docs/EDA_TOOLS.md
      - docs/FACTORY_E2E.md
      - docs/ENGINEERING_GRAPH.md
      - docs/ENGINEERING_RECORDS.md
      - docs/LEARNING_PROPOSALS.md
      - docs/LOOP_CONCURRENCY.md
      - docs/MODEL_SELECTION.md
      - docs/NIRMAAN_ORG_OS.md
      - docs/PERSISTENCE_INTEGRITY.md
      - docs/REPAIR_LOOP.md
      - docs/REVIEW_REPAIR.md
      - docs/RUNTIME_LOOP_FIXES.md
      - docs/SCALABLE_STATE.md
      - docs/SCOPED_REGISTRIES.md
      - docs/STATUS_DOCS.md
      - docs/TOOL_CONTRACTS.md
      - docs/TYPED_VALUES.md
      - docs/UNIFIED_APPLICABILITY.md

  # EDA and Platform.
  - team: eda-platform
    paths:
      - .github/**
      - scripts/**
      - pyproject.toml
      - src/nirmaan/integrations/eda*.py
      - tests/fixtures/eda/**
      - tests/test_ci.py
      - tests/test_status_docs.py
      - docs/TEST_CI_HARDENING.md
      - src/nirmaan/runtime/**
      - src/nirmaan/mcp/**
      - docs/CLAUDE_CODE_RUNTIME.md
      - docs/NIRMAAN_MCP.md
  - team: eda-platform
    co_owners: [product-site]
    paths: [scripts/status.py]

  # Gate files: Verification reviews every gate change.
  - team: eda-platform
    co_owners: [verification]
    paths:
      - src/nirmaan/integrations/eda.py
      - src/nirmaan/work/policy.py
      - src/nirmaan/work/engine.py
      - src/nirmaan/runtime/tools.py
      - src/nirmaan/company/workflows.py
      - scripts/check_*.py
      - scripts/live_eval_gate.py

  # Verification.
  - team: verification
    paths:
      - src/veritriage/**
      - src/nirmaan/evals/**
      - src/nirmaan/vplan.py
      - src/nirmaan/integrations/vplan.py
      - src/nirmaan/integrations/veritriage.py
      - src/nirmaan/eval_proposals.py
      - evals/**
      - tests/fixtures/gate_integrity/**
      - tests/fixtures/vplan/**
      - tests/fixtures/eval_results_synthetic/**
      - tests/test_nirmaan_gate_integrity.py
      - tests/test_nirmaan_formal_gate.py
      - tests/test_nirmaan_gates_*.py
      - tests/test_nirmaan_evals.py
      - tests/test_nirmaan_eval_proposals.py
      - tests/test_nirmaan_live_eval.py
      - tests/test_nirmaan_verification_plan*.py
      - tests/test_veritriage_*.py
      - docs/VERIFICATION_PLAN*.md
      - docs/FORMAL_GATE.md
      - docs/GATE_INTEGRITY.md
      - docs/LIVE_EVAL_EVIDENCE.md
      # Lead review 2026-10-17: VeriTriage tests, parser fixtures and docs,
      # seat evaluation, and the gate milestone docs.
      - src/nirmaan/models/evaluation.py
      - tests/fixtures/*.log
      - tests/fixtures/*.vcd
      - tests/fixtures/*.wave.json
      - tests/fixtures/*.engctx.json
      - tests/fixtures/*.formal.json
      - tests/fixtures/coverage.txt
      - tests/fixtures/test_metadata.json
      - tests/fixtures/project/**
      - tests/test_agents.py
      - tests/test_ai.py
      - tests/test_ai_boundary.py
      - tests/test_analytics.py
      - tests/test_artifact_parsers.py
      - tests/test_automation.py
      - tests/test_cli.py
      - tests/test_collaboration.py
      - tests/test_conversation.py
      - tests/test_engineering.py
      - tests/test_feedback.py
      - tests/test_graph.py
      - tests/test_history.py
      - tests/test_knowledge.py
      - tests/test_learning.py
      - tests/test_models.py
      - tests/test_orchestrator.py
      - tests/test_parsers.py
      - tests/test_planning.py
      - tests/test_project.py
      - tests/test_reasoning.py
      - tests/test_references.py
      - tests/test_regression_diff.py
      - tests/test_report.py
      - tests/test_rules.py
      - tests/test_waveform.py
      - tests/test_workspace.py
      - docs/ARCHITECTURE.md
      - docs/AGENT_FRAMEWORK.md
      - docs/AI_PROVIDERS.md
      - docs/AUTOMATION_ENGINE.md
      - docs/COLLABORATION_PLATFORM.md
      - docs/CONVERSATION_ENGINE.md
      - docs/ENGINEERING_CONTEXT_ENGINE.md
      - docs/EVIDENCE_GRAPH.md
      - docs/INVESTIGATION_ORCHESTRATOR.md
      - docs/KNOWLEDGE_ENGINE.md
      - docs/LEARNING_ENGINE.md
      - docs/PLANNING_ENGINE.md
      - docs/PLATFORM_COMPLETION.md
      - docs/PROJECT_INTELLIGENCE.md
      - docs/REASONING_ENGINE.md
      - docs/REGRESSION_INTELLIGENCE.md
      - docs/WAVEFORM_ENGINE.md
      - docs/WORKSPACE_PLATFORM.md
      - docs/GATES_EVERYWHERE.md
      - docs/GATES_REST.md
      - docs/SEAT_EVALUATION.md
      - docs/EVAL_PROPOSALS.md
      - docs/VERITRIAGE_AUDIT_FIXES.md
  - team: verification
    co_owners: [silicon-design]
    paths:
      - src/veritriage/design/**
      - tests/test_design.py
      - evals/rtl/**
      - evals/firmware/**
      - evals/spec/**

  # Silicon Design.
  - team: silicon-design
    paths:
      - tests/fixtures/fw/**
      - tests/fixtures/pd/**
      - src/nirmaan/integrations/dft*.py
      - src/nirmaan/integrations/firmware*.py
