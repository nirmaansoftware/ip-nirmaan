      - src/nirmaan/integrations/firmware_harness/**
      - src/nirmaan/regmap.py
      - docs/IP_BLOCKS.md
      - docs/DESIGN_AGENTS.md
      - docs/DESIGN_INTELLIGENCE.md
      - docs/DFT*.md
      - docs/PHYSICAL_DESIGN.md
      - docs/*FIRMWARE*.md
      - docs/REGISTER_MAP*.md
      - tests/test_nirmaan_dft*.py
      - tests/test_nirmaan_firmware*.py
      - tests/test_nirmaan_riscv_*.py
      - tests/test_nirmaan_physical.py
      - tests/test_nirmaan_regmap*.py
      - tests/test_nirmaan_sta_antecedents.py
      - tests/test_nirmaan_design_agents.py
      - tests/test_nirmaan_more_blocks.py
      - tests/test_apb_regs_fixture.py
      - tests/test_axi4_lite_fixture.py
      - tests/test_rr_arbiter_fixture.py
      - tests/test_sync_fifo_fixture.py
      # Lead review 2026-10-17: the register map model and the physical
      # design and RISC-V milestone docs.
      - src/nirmaan/models/regmap.py
      - docs/PD_SIGNOFF.md
      - docs/PD_FINAL.md
      - docs/STA_AND_ANTECEDENTS.md
      - docs/RISCV_NEXT.md
  - team: silicon-design
    co_owners: [verification]
    paths: [tests/fixtures/rtl/**]
  - team: silicon-design
    co_owners: [eda-platform]
    paths:
      - src/nirmaan/integrations/physical.py
      - src/nirmaan/integrations/pd_parsers.py
  # Vendored third-party cores (ISC): Business checks the licence and NOTICE.
  - team: silicon-design
    co_owners: [business]
    paths:
      - src/nirmaan/integrations/firmware_soc/serv/**
      - src/nirmaan/integrations/firmware_soc/picorv32.v

  # Product and Site.
  - team: product-site
    paths:
      - site/**
      - README.md
      - docs/LANDING_PAGE_BRIEF.md
      - tests/test_landing_site.py
  # Third-party fonts (OFL, NOTICE): Business checks the licence.
  - team: product-site
    co_owners: [business]
    paths: [site/assets/fonts/*.woff2]

  # Capability programme (M64, docs/WORKED_EXAMPLES.md): the Knowledge PR
  # lists in the qa-evidence, legal-compliance and verification-lead seat files.
  # A division rule (knowledge/<division>/**) lands with its first document.
  - team: verification
    paths:
      - capability/**
  - team: eda-platform
    co_owners: [verification]
    paths:
