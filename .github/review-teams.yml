      - docs/PHYSICAL_DESIGN.md
      - docs/*FIRMWARE*.md
      - docs/REGISTER_MAP*.md
      - tests/test_nirmaan_dft*.py
      - tests/test_nirmaan_firmware*.py
      - tests/test_nirmaan_riscv_*.py
