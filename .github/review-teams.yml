      - tests/test_examples_budget.py
  - team: business
    lead: legal-compliance
    co_owners: [verification]
    paths:
      - knowledge/**
  # Division rule (P1-14): design knowledge also goes to Silicon Design.
  - team: silicon-design
    co_owners: [business, verification]
    paths:
      - knowledge/design/**

  # Business (legal-compliance leads these).
  - team: business
    lead: legal-compliance
    paths:
      - LICENSE
      - NOTICE
      - '**/LICENSE*'
      - site/assets/fonts/OFL-*.txt

  # Council: rules, seats and records. Every Council path is founder class.
  - team: council
    lead: qa-evidence
    paths: [council/**]
  - team: council
    lead: security
    paths:
      - CLAUDE.md
      - .claude/**
      - .github/review-teams.yml
      - docs/REVIEW_MECHANISM.md
  - team: business
    lead: finance-licensing
    paths: ['council/records/*commercial*']

# Parts of a file a path rule cannot see. Each pair of marker comments in the
# file bounds one section; a pull request that changes lines inside it adds
# these teams.
sections:
  - id: partners
    file: site/index.html
    begin: '<!-- review:partners:begin'
    end: '<!-- review:partners:end -->'
    team: product-site
    co_owners: [business]
    founder_class: public-names-and-claims
  # The hero's name and claims (council record 2026-10-18, review loop,
  # decision 1: review markers around the site hero).
  - id: hero
    file: site/index.html
    begin: '<!-- review:hero:begin'
    end: '<!-- review:hero:end -->'
    team: product-site
    founder_class: public-names-and-claims
  - id: roadmap-scope
    file: docs/ROADMAP.md
    begin: '<!-- review:roadmap-scope:begin'
    end: '<!-- review:roadmap-scope:end -->'
    team: product-site

# Ledger: files and sections every milestone updates. They add no owning team
# when the pull request also changes other paths. CI (tests/test_status_docs.py)
# covers their consistency.
ledger:
  paths:
    - context.md
    - docs/history/**
    - site/stats.json
  sections:
    - file: docs/ROADMAP.md
      begin: '<!-- review:milestone-numbers:begin'
      end: '<!-- review:milestone-numbers:end -->'
    - file: docs/ROADMAP.md
      begin: '<!-- status:begin'
      end: '<!-- status:end -->'
  note: site/stats.json counts as ledger only when it equals the output of scripts/status.py --release.

# Content rules: a diff line that matches adds a team. Patterns are Python
# regular expressions over added or removed lines; "in" limits a rule to some
# paths. Each example must match its pattern (the test checks).
content_rules:
  - id: commercial-wording
    adds: business
    lead: finance-licensing
    pattern: '(?i)\b(price|pricing|discount|royalt(y|ies)|payment|invoice|GST|TDS|tax)\b'
    example: 'Royalty: 2 percent of net sales'
  - id: currency-amount
    adds: business
    lead: finance-licensing
    pattern: '(?i)(\$|\bUSD\b|\bINR\b|\bRs\.?|\bEUR\b|₹|€)\s?\d'
    example: 'from USD 4000 a year'
  - id: partner-or-client
    adds: business
    lead: finance-licensing
    pattern: '(?i)\b(design partner|client|customer)s?\b'
    in: [site/**, README.md, docs/LANDING_PAGE_BRIEF.md]
    example: 'Our first design partner is'
  - id: gate-limit
    adds: verification
    pattern: '\b(max|min)_[a-z0-9_]+\b|\bwhen_produced\b|_fail\.v\b|\bNIRMAAN_REQUIRE_EDA\b'
    in: [src/**, evals/**, tests/fixtures/**, .github/**]
    example: 'max_unannotated_nets=0'
  # The four below route what the Founder Proxy checks (council/founder-proxy.md)
  # to the key 1 that holds its checklist: export control, sending outside the
  # repository, and a person named as author, copyright holder or contact
  # (legal-compliance: export control, customer data, notices). Each also
  # raises a founder class, below.
  - id: export-sensitive
    adds: business
    lead: legal-compliance
    pattern: '\b(AES|DES|3DES|RSA|SM4|ECDSA|ECDH|ML-KEM|ML-DSA)\b|(?i:\b(aes(128|192|256)?_\w+|aes-?(128|192|256)|chacha20|poly1305|camellia|twofish|blowfish|kyber|dilithium|block cipher|stream cipher|encryption (core|engine|block)|key expansion|export[- ]control(s|led)?|dual[- ]use|ECCN|EAR99|ITAR|SCOMET|5[AD]002)\b)'
    in: [src/**, tests/**, evals/**, examples/**, scripts/**, docs/**, site/**, README.md]
    example: '// AES-256 encryption core: 14 rounds, full key expansion'
  - id: outbound-sending
    adds: business
    lead: legal-compliance
    pattern: '(?i)\b(smtplib|smtp(_ssl)?|sendmail|send_message|send_email|send_raw_email|emailmessage|mimetext|mimemultipart|nodemailer|sendgrid|mailgun|postmark|twilio)\b|hooks\.slack\.com|chat\.postMessage|api\.telegram\.org|discord(app)?\.com/api/webhooks|api\.resend\.com'
    example: '    with smtplib.SMTP_SSL(host) as smtp:'
  - id: person-attribution
    adds: business
    lead: legal-compliance
    pattern: '\b[Cc]opyright\s+(\([Cc]\)\s*|©\s*)?[A-Z]|©|__author__|@author\b|(?<![\w.+-])(?!nirmaansoftware@)[\w.+-]+@(gmail|googlemail|yahoo|outlook|hotmail|live|proton|protonmail|icloud|rediffmail)\.'
    example: 'Copyright Example Person'
  - id: package-author
    adds: business
    lead: legal-compliance
    pattern: '^\s*(authors|maintainers)\s*=|^\s*\{\s*name\s*=|\bemail\s*='
    in: [pyproject.toml]
    example: 'authors = [{ name = "Example Person", email = "person@example.com" }]'
  # Specification or other third-party text reproduced rather than summarised
  # and cited (legal-compliance's checklist; council record 2026-10-18, review
  # loop, decision 1): rights and permission notices, NDA wording, a
  # standard's document number, and a standard's numbered tables and figures.
  - id: spec-text
    adds: business
    lead: legal-compliance
    pattern: '(?i:\ball rights reserved\b|\b(reproduced|reprinted|excerpted) (from|with permission)\b|\bused with permission\b|\b(confidential|proprietary) (information|document|specification|material)\b|\bunder (an )?NDA\b)|\b(IEEE Std \d{3,4}|JESD\d+[A-Z]?|ARM IHI ?\d{4}|ISO/IEC \d{4,5})\b|\b(Table|Figure) [A-Z]?\d+-\d+\b'
    example: 'Table 3-2 of the protocol specification lists every signal.'

# Key 2 floor: paths on which key 2 stays the chair, on the strongest model,
# whatever a derived `key2:` says (capability build-out record, section 5,
# item 5): evals and the eval harness, MCP, the runtime, and the paths that
# read, store, export or send customer design data. Every founder class is on
# the floor too. Data only today: every key 2 is the chair.
key2_floor:
  - evals/**
  - src/nirmaan/evals/**
  - src/nirmaan/mcp/**
  - src/nirmaan/runtime/**
  - src/nirmaan/integrations/**
  - src/nirmaan/work/store.py
  - src/nirmaan/export.py
  - src/veritriage/ai/**
  - src/veritriage/parsers/**
  - src/veritriage/project/**
  - src/veritriage/storage/**

# Founder classes: a pull request in any of these gets a third reviewer, the
# Founder Proxy (agent, council/founder-proxy.md), after key 1 and key 2 pass,
# under the founder's delegation of 2026-10-18; what the founder keeps it sends
# to the founder as needs-founder. The review script detects path globs and
# content triggers from main's copy of this file. There is no CODEOWNERS file.
founder_classes:
  - id: control-plane
    title: Control plane
    paths:
      - .github/**
      - .claude/**
      - CLAUDE.md
      - council/**
      - scripts/check_*.py
      - scripts/live_eval_gate.py
      - scripts/pr_review.py
      - scripts/review_map.py
      - scripts/pr_loop.py
      - docs/pr-loop.plist
      - tests/test_seat_map.py
    note: .github/** covers .github/review-teams.yml. The pr-review skill (.claude/skills/pr-review/) falls under .claude/**; its posting script (scripts/pr_review.py), the map logic it shares with the coverage test (scripts/review_map.py), the automated loop that drives it (scripts/pr_loop.py) and the launchd job that runs the loop (docs/pr-loop.plist) are listed here.
  - id: gate-semantics
    title: Gate semantics
    paths:
      - src/nirmaan/integrations/eda.py
      - src/nirmaan/work/policy.py
      - src/nirmaan/work/engine.py
      - src/nirmaan/runtime/tools.py
      - src/nirmaan/company/workflows.py
      - scripts/check_*.py
      - scripts/live_eval_gate.py
    content:
      - pattern: '\bNIRMAAN_REQUIRE_EDA\b'
        example: 'NIRMAAN_REQUIRE_EDA: "1"'
      - pattern: '\b(no-tools|physical-design|test-union|dashes)\b'
        in: [.github/workflows/**]
        example: '  test-union:'
  - id: licence-and-third-party
    title: Licence and third-party
    paths:
      - LICENSE
      - NOTICE
      - '**/LICENSE*'
      - site/assets/fonts/OFL-*.txt
      - src/nirmaan/integrations/firmware_soc/serv/**
      - src/nirmaan/integrations/firmware_soc/picorv32.v
    content:
      - pattern: '^\s*(license|classifiers|dependencies)\s*='
        in: [pyproject.toml]
        example: 'license = { text = "Apache-2.0" }'
      - pattern: '(?i)SPDX-License-Identifier|\bcopyright\s+(\(c\)\s*)?\d{4}'
        example: '// SPDX-License-Identifier: ISC'
      - pattern: '^\s*(authors|maintainers)\s*=|^\s*\{\s*name\s*=|\bemail\s*='
        in: [pyproject.toml]
        example: 'authors = [{ name = "Example Person", email = "person@example.com" }]'
      - pattern: '\b[Cc]opyright\s+(\([Cc]\)\s*|©\s*)?[A-Z]|©|__author__|@author\b|(?<![\w.+-])(?!nirmaansoftware@)[\w.+-]+@(gmail|googlemail|yahoo|outlook|hotmail|live|proton|protonmail|icloud|rediffmail)\.'
        example: 'Copyright Example Person'
    note: A pyproject.toml change is founder class only when it touches the licence field, classifiers, dependencies, authors or maintainers, so pyproject.toml is not a path glob here. Attribution is in this class too (who is named as author, maintainer, copyright holder or contact, and personal email addresses), so the Founder Proxy sees any name other than "Nirmaan".
  - id: commercial
    title: Commercial
    content:
      - pattern: '(?i)\b(price|pricing|discount|rate card|royalt(y|ies)|payment|invoice|GST|TDS|tax)\b'
        example: 'a 20 percent discount'
      - pattern: '(?i)(\$|\bUSD\b|\bINR\b|\bRs\.?|\bEUR\b|₹|€)\s?\d'
        example: 'Rs. 50000'
      - pattern: '(?i)\b(smtplib|smtp(_ssl)?|sendmail|send_message|send_email|send_raw_email|emailmessage|mimetext|mimemultipart|nodemailer|sendgrid|mailgun|postmark|twilio)\b|hooks\.slack\.com|chat\.postMessage|api\.telegram\.org|discord(app)?\.com/api/webhooks|api\.resend\.com'
        example: 'smtp.send_message(msg)'
    note: Also anything that adds spend (a paid tool, runner or service), which a key-1 review flags, and any code that sends an email or message to anyone outside the repository (a mail library or service, or a chat webhook), which the Founder Proxy reserves for the founder.
  - id: public-names-and-claims
    title: Public names and claims
    sections: [partners, hero]
    content:
      - pattern: '(?i)<meta\b|<title>'
        in: [site/**]
        example: '<meta name="description" content="x">'
    note: On site/** or README.md, a new or changed public name, a named client, partner or person, launch status lines, or a new capability, performance or compliance claim in the hero or meta tags. Ordinary copy edits are not in this class.
  - id: export-control
    title: Export-control sensitive content
    content:
      - pattern: '\b(AES|DES|3DES|RSA|SM4|ECDSA|ECDH|ML-KEM|ML-DSA)\b|(?i:\b(aes(128|192|256)?_\w+|aes-?(128|192|256)|chacha20|poly1305|camellia|twofish|blowfish|kyber|dilithium|block cipher|stream cipher|encryption (core|engine|block)|key expansion|export[- ]control(s|led)?|dual[- ]use|ECCN|EAR99|ITAR|SCOMET|5[AD]002)\b)'
        in: [src/**, tests/**, evals/**, examples/**, scripts/**, docs/**, site/**, README.md]
        example: 'module aes256_core ('
    note: Flagged by legal-compliance in its review; the scope is to be confirmed by counsel. The pattern detects cryptographic cores and algorithms (encryption, key exchange, signatures) and export-control terms; it only routes a pull request to legal-compliance's key 1 and the Founder Proxy, and does not decide what is controlled. Hash functions (SHA, CRC) and error-correcting codes (ECC) are not in it. Knowledge documents (knowledge/**, capability/**) are left to the export screen of council/records/2026-10-18-capability-buildout.md (section 9 item 10, founder item 8), which this does not decide; legal-compliance already holds key 1 on knowledge/**.

# Composite key 1 (council record 2026-10-18, review loop, decision 1): one
# key-1 call per head in place of one per owning team. Read only while the
# review script's switch (`composite_key1` in scripts/pr_review.py CONFIG) is
# on, which it is since its own pull request after the A/B run on the seeded
# sets (R10; aggregates and seed digests in docs/REVIEW_CALIBRATION.md).
# How it loads (scripts/review_map.py, key1_plan):
# - the seat that speaks is the lead of the owning team that comes first in
#   `precedence`, and its seat file loads whole;
# - the "In a review" section of every owning team's lead loads;
# - `content_rules` add an owning team for the composite call only;
# - a member checklist loads when a trigger matches: `teams` (one of them owns
#   the pull request), `paths` (a changed path), `content` (a changed line;
#   `in` limits it to some paths) or `ranges` (a changed line between a line
#   holding `begin` and one holding `end` in `file`), never by membership alone;
# - `always` seats load on every head.
# The verdict has one entry per loaded checklist.
composite_key1:
  precedence: [council, verification, business, silicon-design, product-site, eda-platform]
  always: [legal-compliance]
  members:
    - seat: qa-evidence
      teams: [verification]
    - seat: security
      paths: [.github/**, scripts/**, src/nirmaan/mcp/**, src/nirmaan/runtime/**]
    - seat: dft-engineer
      paths:
        - src/nirmaan/integrations/dft*.py
        - tests/fixtures/rtl/dft/**
        - tests/fixtures/rtl/mbist/**
        - tests/test_nirmaan_dft*.py
        - docs/DFT*.md
      content:
        - pattern: 'at_least\("test_coverage"|\bdft\.[a-z_]+|March C-'
          in: [src/nirmaan/company/workflows.py]
          example: 'bounds=(at_least("test_coverage", 90),)),'
    - seat: physical-design-engineer
      paths:
        - src/nirmaan/integrations/physical.py
        - src/nirmaan/integrations/pd_parsers.py
        - tests/fixtures/pd/**
        - tests/test_nirmaan_physical.py
        - tests/test_nirmaan_sta_antecedents.py
        - docs/PHYSICAL_DESIGN.md
        - docs/PD_*.md
        - docs/STA_AND_ANTECEDENTS.md
      content:
        - pattern: '\b(unannotated_nets|timing_corners|SIGNOFF_LIMITS)\b|\bsta\.[a-z_]+'
          in: [src/nirmaan/company/workflows.py]
          example: 'SIGNOFF_LIMITS = (at_most("unannotated_nets", 0), at_least("timing_corners", 3))'
      ranges:
        - file: .github/workflows/ci.yml
          begin: '  physical-design-shard:'
          end: '  test-union:'
    - seat: firmware-engineer
      paths:
        - src/nirmaan/integrations/firmware*.py
        - src/nirmaan/integrations/firmware_soc/**
        - src/nirmaan/integrations/firmware_harness/**
        - src/nirmaan/integrations/regmap.py
        - src/nirmaan/regmap.py
        - tests/fixtures/fw/**
        - tests/test_nirmaan_firmware*.py
        - tests/test_nirmaan_riscv_*.py
        - docs/*FIRMWARE*.md
      content:
        - pattern: '\b(require_irq|require_bus_error_trap|text_bytes)\b|\bfw\.[a-z_]+'
          example: 'params=(("require_irq", "yes"),)'
    - seat: site-engineer
      teams: [product-site]
    - seat: brand-content
      teams: [product-site]
    - seat: tax-accounts
      teams: [business]
