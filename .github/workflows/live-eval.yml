name: Live evaluation

# M45: a weekly live evaluation of the seats on the owner's Claude plan, kept as
# a run record (docs/LIVE_EVAL_EVIDENCE.md). It never runs on a pull request or
# a push. It is off until the repository secret CLAUDE_CODE_OAUTH_TOKEN exists
# (from `claude setup-token`): without it the gate step writes enabled=false
# and every later step is skipped, so the job is green and spends nothing. The
# record is uploaded as a workflow artifact; it is never committed from here.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Gate on the secret
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/live_eval_gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install open-source EDA tools
        if: steps.gate.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog yosys
      # The same pinned OSS CAD Suite as ci.yml, for a seat that writes a proof.
      - name: Install SymbiYosys and Yices (OSS CAD Suite 2026-09-28)
        if: steps.gate.outputs.enabled == 'true'
        env:
          OSS_CAD_SUITE: "2026-09-28"
        run: |
          curl -sSfL "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/formal-bin"
          for tool in sby yices-smt2; do
            printf '#!/bin/sh\nexec "%s/oss-cad-suite/bin/%s" "$@"\n' "$RUNNER_TEMP" "$tool" > "$RUNNER_TEMP/formal-bin/$tool"
            chmod +x "$RUNNER_TEMP/formal-bin/$tool"
          done
          echo "$RUNNER_TEMP/formal-bin" >> "$GITHUB_PATH"
      - name: Install Claude Code
        if: steps.gate.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pip install -e ".[dev]"
      - name: Run the live evaluation
        id: run
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          NIRMAAN_CLAUDE_CODE="$(which claude)" nirmaan eval run --runtime claude-code --trials 5 \
            --seats rtl,spec,firmware --out "$RUNNER_TEMP/results"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Upload the run record
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-record
          path: ${{ runner.temp }}/results
      - name: Re-judge the record
        if: steps.gate.outputs.enabled == 'true'
        run: nirmaan eval rejudge "$RUNNER_TEMP"/results/*/
      - name: Fail when a trial failed
        if: steps.gate.outputs.enabled == 'true'
        run: test "${{ steps.run.outputs.exit }}" = "0"
