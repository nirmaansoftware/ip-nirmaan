name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 24.04 ships Verilator 5, which the `--binary` simulation backend needs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install open-source EDA tools
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog yosys
      # M26: formal in CI. apt has no `sby`, so SymbiYosys and Yices come from a
      # pinned YosysHQ OSS CAD Suite release. Only two wrappers go on PATH, so
      # the suite's own Verilator, Icarus, and Yosys never replace apt's for
      # the other tests; the suite's `sby` launcher puts the suite's `bin`
      # first for its own process, so a proof runs the suite's matched Yosys
      # and yosys-smtbmc. See docs/FORMAL_GATE.md.
      - name: Install SymbiYosys and Yices (OSS CAD Suite 2026-09-28)
        env:
          OSS_CAD_SUITE: "2026-09-28"
        run: |
          curl -sSfL "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/formal-bin"
          for tool in sby yices-smt2; do
            printf '#!/bin/sh\nexec "%s/oss-cad-suite/bin/%s" "$@"\n' "$RUNNER_TEMP" "$tool" > "$RUNNER_TEMP/formal-bin/$tool"
            chmod +x "$RUNNER_TEMP/formal-bin/$tool"
          done
          echo "$RUNNER_TEMP/formal-bin" >> "$GITHUB_PATH"
      # M27: the driver cross-compiled for RV32I and run on PicoRV32 against the
      # RTL. Ubuntu's multilib GCC includes rv32i/ilp32; the SoC runtime carries
      # its own small libc, so no picolibc. See docs/RISCV_FIRMWARE.md.
      - name: Install the RISC-V cross compiler
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version | head -1
          riscv64-unknown-elf-gcc -print-multi-lib | grep rv32i/ilp32
      - name: Tool versions
        run: |
          which verilator iverilog yosys sby yices-smt2
          yosys -V && verilator --version && sby --version && yices-smt2 --version | head -1
      - name: Install
        run: pip install -e ".[ai,dev]"
      - name: Test
        # A real-tool test whose executable is named here fails instead of
        # skipping. `cc` and `make` build the firmware and its co-simulation
        # (M25); `sby` and `yices-smt2` run formal (M26); the RISC-V GCC builds
        # the image PicoRV32 runs against the RTL (M27).
        env:
          NIRMAAN_REQUIRE_EDA: verilator iverilog vvp yosys cc make sby yices-smt2 riscv64-unknown-elf-gcc
        run: python -m pytest -q -rs

  # M27: physical design for real. OpenROAD (with its embedded OpenSTA), a
  # matched Yosys, and the Nangate45 platform files all come from one pinned
  # OpenROAD-flow-scripts image, so the job runs inside it. Only the physical
  # design tests run here; the main test job stays as it was. See
  # docs/PHYSICAL_DESIGN.md.
  physical-design:
    runs-on: ubuntu-24.04
    container:
      image: openroad/orfs:26Q3-687-gc63a606f9@sha256:2e5bf6fe865e102ca2313aba1d849da50f5973bc91c4212a2f68e7d905a39c8f
    env:
      NIRMAAN_PDK_ROOT: /OpenROAD-flow-scripts/flow/platforms
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Tools on PATH
        run: |
          echo /OpenROAD-flow-scripts/tools/install/OpenROAD/bin >> "$GITHUB_PATH"
          echo /OpenROAD-flow-scripts/tools/install/yosys/bin >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          # The image ships no standalone sta; the next steps build one (M29).
          which openroad yosys
          openroad -version && yosys -V
          ls "$NIRMAAN_PDK_ROOT/nangate45/lib/NangateOpenCellLibrary_typical.lib"
      # M29: standalone OpenSTA, built from the commit the image's OpenROAD embeds
      # (OpenROAD c487fc70, src/sta), with the compilers and libraries the image
      # already has; cached by commit. See docs/PD_SIGNOFF.md.
      - name: Cache standalone OpenSTA
        id: opensta
        uses: actions/cache@v4
        with:
          path: /opt/opensta
          key: opensta-e983e15b2cb346badf8f23725fd3914d25312c44-orfs-26Q3-687
      - name: Build standalone OpenSTA
        if: steps.opensta.outputs.cache-hit != 'true'
        env:
          OPENSTA: e983e15b2cb346badf8f23725fd3914d25312c44
        run: |
          git init -q "$RUNNER_TEMP/OpenSTA" && cd "$RUNNER_TEMP/OpenSTA"
          git fetch -q --depth 1 https://github.com/The-OpenROAD-Project/OpenSTA.git "$OPENSTA"
          git checkout -q FETCH_HEAD
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCUDD_DIR=/usr/local 2>&1 | tail -20
          cmake --build build -j "$(nproc)" --target sta 2>&1 | tail -40
          mkdir -p /opt/opensta/bin && cp build/sta /opt/opensta/bin/sta
      - name: Standalone OpenSTA on PATH
        run: |
          echo /opt/opensta/bin >> "$GITHUB_PATH"
          /opt/opensta/bin/sta -version
      # M37: a timing-closure project's RTL fix passes its RTL gates (lint and
      # simulation) before re-analysis times it. The image's Ubuntu 22.04 Icarus
      # (11) prints no "$finish called" line, so Verilator, Icarus, and vvp come
      # from the same pinned OSS CAD Suite the test job uses, as wrappers, so the
      # image's own Yosys stays first. See docs/STA_AND_ANTECEDENTS.md.
      - name: RTL gate tools (OSS CAD Suite 2026-09-28)
        shell: bash  # the container's default sh has no ${var//-/}
        env:
          OSS_CAD_SUITE: "2026-09-28"
        run: |
          curl -sSfL "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/gate-bin"
          for tool in verilator iverilog vvp; do
            printf '#!/bin/sh\nexec "%s/oss-cad-suite/bin/%s" "$@"\n' "$RUNNER_TEMP" "$tool" > "$RUNNER_TEMP/gate-bin/$tool"
            chmod +x "$RUNNER_TEMP/gate-bin/$tool"
          done
          echo "$RUNNER_TEMP/gate-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gate-bin/verilator" --version && "$RUNNER_TEMP/gate-bin/iverilog" -V | head -1
      # M34: the slow and fast sky130hd corners (the image ships typical only), from the
      # open_pdks build of the SkyWater library, pinned by release and sha256, cached by
      # hash, and put beside the platform's typical Liberty. See docs/PD_FINAL.md.
      - name: Cache the sky130hd corner libraries
        id: corners
        uses: actions/cache@v4
        with:
          path: /opt/sky130hd-corners
          key: sky130hd-corners-9b24f0db-fb61d91c
      - name: Fetch the sky130hd corner libraries
        if: steps.corners.outputs.cache-hit != 'true'
        env:
          RELEASE: sky130-ff08c23db8359afce3f134c454e7930586d0641c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hd.tar.zst" \
            "https://github.com/fossi-foundation/ciel-releases/releases/download/$RELEASE/sky130_fd_sc_hd.tar.zst"
          echo "69500f75f639989fb2c01b5fa7347aa5972e80238abb4460a7304fa8de405977  $RUNNER_TEMP/hd.tar.zst" | sha256sum -c
          uv pip install zstandard
          mkdir -p /opt/sky130hd-corners
          python - "$RUNNER_TEMP/hd.tar.zst" /opt/sky130hd-corners <<'PY'
          import sys, tarfile, zstandard
          wanted = {f"sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__{c}.lib" for c in ("ss_100C_1v60", "ff_n40C_1v95")}
          with open(sys.argv[1], "rb") as f, tarfile.open(fileobj=zstandard.ZstdDecompressor().stream_reader(f), mode="r|") as tar:
              for member in tar:
                  if member.name in wanted and member.isfile():
                      member.name = member.name.rsplit("/", 1)[1]
                      tar.extract(member, sys.argv[2], filter="data")
          PY
      - name: Corner libraries into the platform
        run: |
          cd /opt/sky130hd-corners
          sha256sum -c <<'SUMS'
          9b24f0db3967ac67b4cae1f74bb480fd47922d18d0ed577e3c121739b412c361  sky130_fd_sc_hd__ss_100C_1v60.lib
          fb61d91c55a7f85b1989e8149d040b13ba5e7f5478f5bf0c3c16c5da30720139  sky130_fd_sc_hd__ff_n40C_1v95.lib
          SUMS
          cp sky130_fd_sc_hd__*.lib "$NIRMAAN_PDK_ROOT/sky130hd/lib/"
          klayout -v
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test
        # openroad, yosys, (M29) sta, and (M34) klayout are required, so the real STA,
        # place-and-route, and physical verification tests fail rather than skip; (M37)
        # so are the RTL gate tools.
        env:
          NIRMAAN_REQUIRE_EDA: yosys openroad sta klayout verilator iverilog vvp
        run: python -m pytest -q -rs tests/test_nirmaan_physical.py tests/test_nirmaan_sta_antecedents.py --basetemp="$RUNNER_TEMP/pd"
      - name: Keep the tool logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-logs
          path: ${{ runner.temp }}/pd

  dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No em or en dashes in tracked text files
        run: python scripts/check_dashes.py
