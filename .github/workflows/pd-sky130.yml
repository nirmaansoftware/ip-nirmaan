name: pd-sky130

# M79: the SKY130 physical design pilot. The M26 synchronous FIFO from RTL through synthesis,
# place and route, and DRC and LVS twice: the platform's KLayout decks (M34) and Magic and
# Netgen over the open_pdks SKY130A files (pv.run backend magic-netgen). GitHub-hosted runners
# only; nothing here runs on a development machine. Not a required check: it runs on demand and
# when the physical design flow or the pilot block changes. See docs/PD_SKY130_PILOT.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pd-sky130.yml
      - src/nirmaan/integrations/physical.py
      - src/nirmaan/integrations/pv_magic.py
      - src/nirmaan/integrations/pd_parsers.py
      - tests/test_pd_sky130_pilot.py
      - tests/fixtures/pd/sync_fifo.sdc
      - tests/fixtures/rtl/sync_fifo/sync_fifo.v
  push:
    branches: [main]
    paths:
      - .github/workflows/pd-sky130.yml
      - src/nirmaan/integrations/physical.py
      - src/nirmaan/integrations/pv_magic.py
      - src/nirmaan/integrations/pd_parsers.py
      - tests/test_pd_sky130_pilot.py
      - tests/fixtures/pd/sync_fifo.sdc
      - tests/fixtures/rtl/sync_fifo/sync_fifo.v

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sky130-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The same pinned OpenROAD-flow-scripts image as ci.yml's physical-design job: OpenROAD,
    # Yosys, KLayout, and the sky130hd platform, built together.
    container:
      image: openroad/orfs:26Q3-687-gc63a606f9@sha256:2e5bf6fe865e102ca2313aba1d849da50f5973bc91c4212a2f68e7d905a39c8f
    env:
      NIRMAAN_PDK_ROOT: /OpenROAD-flow-scripts/flow/platforms
      NIRMAAN_PD_PILOT: "1"
      # Magic and Netgen, built from these release tags (commits checked) and cached by them.
      MAGIC_TAG: 8.3.686
      MAGIC_COMMIT: 56319630d4a304a55e1139fdfe59594ca00bf05c
      NETGEN_TAG: 1.5.325
      NETGEN_COMMIT: 85bddb8f273c00fb402f3492f5e2bb4337a568b4
      # The open_pdks build of SKY130 that ci.yml already pins (M34), by release and sha256.
      CIEL_RELEASE: sky130-ff08c23db8359afce3f134c454e7930586d0641c
    defaults:
      run:
        shell: bash  # the container defaults to sh, which has no pipefail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Tools on PATH
        run: |
          echo /OpenROAD-flow-scripts/tools/install/OpenROAD/bin >> "$GITHUB_PATH"
          echo /OpenROAD-flow-scripts/tools/install/yosys/bin >> "$GITHUB_PATH"
          echo /opt/magic-netgen/bin >> "$GITHUB_PATH"
      # Tcl/Tk and Cairo for Magic and Netgen, from the image's Ubuntu archive (build and runtime).
      - name: Magic and Netgen build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential m4 tcsh csh tcl-dev tk-dev libx11-dev libcairo2-dev libglu1-mesa-dev zlib1g-dev git ca-certificates > /dev/null
      - name: Cache Magic and Netgen
        id: magic-netgen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/magic-netgen
          key: magic-netgen-${{ env.MAGIC_COMMIT }}-${{ env.NETGEN_COMMIT }}-orfs-26Q3-687
      - name: Build Magic and Netgen
        if: steps.magic-netgen.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          for tool in magic netgen; do
            upper=${tool^^}; tag_var=${upper}_TAG; commit_var=${upper}_COMMIT
            git init -q "$RUNNER_TEMP/$tool" && cd "$RUNNER_TEMP/$tool"
            git fetch -q --depth 1 "https://github.com/RTimothyEdwards/$tool.git" "refs/tags/${!tag_var}"
            git checkout -q FETCH_HEAD
            test "$(git rev-parse HEAD)" = "${!commit_var}"
            ./configure --prefix=/opt/magic-netgen 2>&1 | tail -5
            make -j "$(nproc)" 2>&1 | tail -5
            make install 2>&1 | tail -3
          done
      - name: Cache the SKY130A files for Magic and Netgen
        id: sky130a
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/sky130A
          key: sky130A-magic-netgen-7f7e8dcb-69500f75
      - name: Fetch the SKY130A files for Magic and Netgen
        if: steps.sky130a.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/fossi-foundation/ciel-releases/releases/download/$CIEL_RELEASE"
          curl -sSfL -o "$RUNNER_TEMP/common.tar.zst" "$base/common.tar.zst"
          curl -sSfL -o "$RUNNER_TEMP/hd.tar.zst" "$base/sky130_fd_sc_hd.tar.zst"
          sha256sum -c <<SUMS
          7f7e8dcbb7b98ab15a5f9ed0acd3bd3f933f1925171724a9af25b18a1cd6f457  $RUNNER_TEMP/common.tar.zst
          69500f75f639989fb2c01b5fa7347aa5972e80238abb4460a7304fa8de405977  $RUNNER_TEMP/hd.tar.zst
          SUMS
          uv pip install zstandard
          python - /opt <<'PY'
          import os, sys, tarfile, zstandard
          wanted = {"sky130A/libs.tech/magic/sky130A.tech", "sky130A/libs.tech/netgen/sky130A_setup.tcl",
                    "sky130A/libs.ref/sky130_fd_sc_hd/spice/sky130_fd_sc_hd.spice"}
          for archive in ("common", "hd"):
              path = os.path.join(os.environ["RUNNER_TEMP"], f"{archive}.tar.zst")
              with open(path, "rb") as f, tarfile.open(fileobj=zstandard.ZstdDecompressor().stream_reader(f), mode="r|") as tar:
                  for member in tar:
                      if member.name in wanted and member.isfile():
                          tar.extract(member, sys.argv[1], filter="data")
                          wanted.discard(member.name)
          sys.exit(f"missing from the release: {sorted(wanted)}" if wanted else 0)
          PY
      - name: SKY130A files into the PDK root
        run: |
          cp -r /opt/sky130A "$NIRMAAN_PDK_ROOT/sky130A"
          find "$NIRMAAN_PDK_ROOT/sky130A" -type f -exec sha256sum {} +
      - name: Tool versions
        run: |
          which openroad yosys klayout magic netgen
          openroad -version && yosys -V && klayout -v
          echo 'puts "magic [version]"; quit -noprompt' > "$RUNNER_TEMP/v.tcl" && magic -dnull -noconsole "$RUNNER_TEMP/v.tcl" | tail -2
          netgen -batch quit 2>&1 | head -3 || true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Pilot
        env:
          NIRMAAN_REQUIRE_EDA: yosys openroad klayout magic netgen
        run: >-
          python -m pytest -q -rs -s tests/test_pd_sky130_pilot.py
          --basetemp="$RUNNER_TEMP/pd" --junitxml="$RUNNER_TEMP/junit/pd-sky130.xml"
      # Text only (logs, scripts, reports, the comparison JSON): no layout or PDK data.
      - name: Keep the tool logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pd-sky130-logs
          path: |
            ${{ runner.temp }}/pd/**/*.log
            ${{ runner.temp }}/pd/**/*.tcl
            ${{ runner.temp }}/pd/**/*.report
            ${{ runner.temp }}/pd/**/*.json
            ${{ runner.temp }}/junit
          if-no-files-found: warn
