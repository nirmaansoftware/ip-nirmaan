name: Review loop

# R7: the automated review loop (scripts/pr_loop.py --once) in GitHub Actions instead of the
# Mac's launchd job. It lands OFF: the `loop` mode runs only while the repository variable
# REVIEW_LOOP_CLOUD is `on`, which the founder sets after `launchctl bootout` of the Mac's IP
# loop, so only one loop ever writes. `check` and `shadow` (workflow_dispatch only) never post
# and never write state. It never runs on a pull request or a push. Its secrets are
# environment secrets of `review-loop`, an environment only `main` may deploy to, so no
# pull request workflow can read them. The workflow token reads only; the loop posts with the
# review App's token and pushes and merges with LOOP_GH_TOKEN, as the Mac's gh login does. No
# claude process and no check gets a token in its environment (docs/REVIEW_MECHANISM.md).
# Setup and switch-on: docs/REVIEW_MECHANISM.md ("Running the loop in GitHub Actions").
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop (only while REVIEW_LOOP_CLOUD is on), check (auth and the /proc deny rule), shadow (--no-post on one pull request)"
        type: choice
        options: [loop, check, shadow]
        default: loop
      pr:
        description: "shadow only: the pull request number"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: review-loop
  cancel-in-progress: false

jobs:
  review-loop:
    if: >-
      github.ref == 'refs/heads/main' && (
      (vars.REVIEW_LOOP_CLOUD == 'on' && (github.event_name == 'schedule' || inputs.mode == 'loop')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'check' || inputs.mode == 'shadow')))
    runs-on: ubuntu-24.04
    environment: review-loop
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'loop' }}
    steps:
      # /srv/loop, not the home folder (mode 750), so the check account can reach the fixer's worktree.
      - name: State paths
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 /srv/loop
          echo "NIRMAAN_REVIEW_STATE_DIR=/srv/loop/pr-review" >> "$GITHUB_ENV"
          echo "STATE_CLONE=$RUNNER_TEMP/loop-state" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mint the review App token
        id: app
        if: env.MODE == 'loop'
        env:
          REVIEW_APP_ID: ${{ secrets.REVIEW_APP_ID }}
          REVIEW_APP_INSTALLATION_ID: ${{ secrets.REVIEW_APP_INSTALLATION_ID }}
          REVIEW_APP_PRIVATE_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
        run: python3 scripts/loop_cloud.py app-token
      # The deploy key is on disk only inside this step and the push step, never while a model runs.
      - name: Pull the loop state
        id: pull
        if: env.MODE == 'loop'
        env:
          STATE_KEY: ${{ secrets.LOOP_STATE_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/state-key"; trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$STATE_KEY" > "$key")
          printf '%s\n' "$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import loop_cloud; print(loop_cloud.GITHUB_HOST_KEY)')" > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          python3 scripts/loop_cloud.py pull --clone "$STATE_CLONE" --state-dir "$NIRMAAN_REVIEW_STATE_DIR"
      - name: Anything to step?
        id: work
        env:
          NIRMAAN_REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ "$MODE" = loop ]; then python3 scripts/loop_cloud.py has-work --state-dir "$NIRMAAN_REVIEW_STATE_DIR"
          else echo "work=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.work.outputs.work == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The fixer's local checks run the related tests, so the tools are CI's (ci.yml, test-shard).
      - name: Install open-source EDA tools and the RISC-V cross compiler
        if: steps.work.outputs.work == 'true' && env.MODE != 'check'
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog yosys gcc-riscv64-unknown-elf
      - name: SymbiYosys, Yices and eqy (OSS CAD Suite 2026-09-28)
        if: steps.work.outputs.work == 'true' && env.MODE != 'check'
        uses: ./.github/actions/oss-cad-suite
        with:
          tools: sby yices-smt2 eqy
      # The loop runs from its own clone of this commit, as the Mac's job does, where the check account can read it.
      - name: Loop clone and install
        if: steps.work.outputs.work == 'true' && env.MODE != 'check'
        run: |
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" /srv/loop/ip-nirmaan
          git -C /srv/loop/ip-nirmaan checkout --quiet --detach "$GITHUB_SHA"
          git -C /srv/loop/ip-nirmaan remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          pip install -e "/srv/loop/ip-nirmaan[ai,dev,cocotb]"
      # Claude Code 2.1.325 and its platform package, each checked against the sha512 in the lockfile.
      - name: Install Claude Code
        if: steps.work.outputs.work == 'true'
        run: |
          npm ci --prefix .github/review-loop --no-audit --no-fund
          echo "NIRMAAN_CLAUDE_CODE=$PWD/.github/review-loop/node_modules/.bin/claude" >> "$GITHUB_ENV"
          .github/review-loop/node_modules/.bin/claude --version
      # The loop's local checks run the pull request's tests as this account, which cannot read the
      # loop's or a model's process environment or memory.
      - name: Make the check account
        if: steps.work.outputs.work == 'true' && env.MODE != 'check'
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin loopcheck
      # Both steps `exec` the script, which moves the secrets out of its environment before any
      # claude process starts. `claude auth status` makes no model call; `check` also proves the
      # /proc deny rule with one small call.
      - name: Check the Claude login
        if: steps.work.outputs.work == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$MODE" = check ]; then exec python scripts/loop_cloud.py auth-check --deny-probe; fi
          exec python scripts/loop_cloud.py auth-check
      - name: Run the loop once
        if: steps.work.outputs.work == 'true' && env.MODE != 'check'
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.LOOP_GH_TOKEN }}
          NIRMAAN_REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIRMAAN_LOOP_CHECK_USER: loopcheck
          SHADOW_PR: ${{ inputs.pr }}
        run: |
          git config --global credential.https://github.com.helper ''
          git config --global --add credential.https://github.com.helper '!gh auth git-credential'
          cd /srv/loop/ip-nirmaan
          if [ "$MODE" = shadow ]; then exec python scripts/loop_cloud.py run --shadow "$SHADOW_PR"; fi
          exec python scripts/loop_cloud.py run
      - name: Push the loop state
        if: always() && steps.pull.outcome == 'success'
        env:
          STATE_KEY: ${{ secrets.LOOP_STATE_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/state-key"; trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$STATE_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          python3 scripts/loop_cloud.py push --clone "$STATE_CLONE" --state-dir "$NIRMAAN_REVIEW_STATE_DIR"
